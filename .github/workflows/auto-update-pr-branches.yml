name: Auto-update PR branches

# Branch protection on main requires PR branches to be up to date with
# their base before merging (see CLAUDE.md). Rather than manually clicking
# "Update branch" on every stale PR, update all of them proactively
# whenever any branch in the repo moves — this also covers stacked PRs
# whose base is another PR's branch, not main directly.
on:
  push:
    branches:
      - '**'

jobs:
  update-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update out-of-date PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --state open --json number,mergeStateStatus -q '.[] | select(.mergeStateStatus == "BEHIND") | .number'); do
            echo "Updating PR #$pr"
            gh api "repos/$GH_REPO/pulls/$pr/update-branch" -X PUT || echo "Failed to update PR #$pr, skipping"
          done
