name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the image pinned in docker-compose.yml, so "works in CI"
        # and "works locally" mean the same database.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Matches the image pinned in docker-compose.yml.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        # A service container, unlike MinIO below. The warning on that step
        # is specific to an image whose CMD lacks its own server arguments;
        # this image's default command is rabbitmq-server, which is exactly
        # what is wanted. Matches the tag pinned in docker-compose.yml.
        image: rabbitmq:4-alpine
        env:
          # A dedicated account, not the built-in "guest": RabbitMQ confines
          # guest to loopback as the broker itself sees it, and a connection
          # through the published port below reaches it from the Docker
          # bridge, so guest is refused here too.
          RABBITMQ_DEFAULT_USER: video
          RABBITMQ_DEFAULT_PASS: video
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # Matches the "go" directive in go.mod and the Docker builder's
        # minor version so CI validates the production build toolchain.
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # setup-go's built-in cache only restores on an exact match of
          # resolved Go patch version + go.sum hash (also scoped by runner
          # OS/arch/image, unchanged here since this always runs on
          # ubuntu-latest). This repo's high branch/dependency churn on
          # go.sum also causes frequent misses. Cache it explicitly below,
          # with a restore-keys fallback so a near match still warm-starts.
          cache: false

      - name: Get resolved Go version
        # The go.mod directive establishes the minimum toolchain while
        # setup-go resolves the latest available 1.27 patch release. The
        # build cache below needs that resolved version in its key: GOCACHE
        # entries are internally keyed by the compiler's own build ID, so
        # restoring a cache built under a different patch version is a
        # silent no-op — the directory restores fine and actions/cache
        # reports a hit, but `go vet`/`go test` reject every cached object
        # as stale and recompile from scratch.
        id: go-version
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.go-version.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.go-version.outputs.version }}-

      - name: Cache apt packages
        # /var/cache/apt/archives is root-owned, so actions/cache (running
        # unprivileged) can't extract a restored cache into it — confirmed
        # by an actual "Permission denied" failure on every .deb when this
        # was tried directly. Point apt at a runner-owned staging dir
        # instead via dir::cache::archives, so it's never touched.
        # Cache only the finished *.deb files, not the whole staging dir —
        # apt also creates a `lock` file and `partial/` dir in there with
        # root-only permissions while downloading, which the unprivileged
        # save step can't read either (confirmed: also failed with
        # "Permission denied", just on those two paths instead).
        # Static, manually-bumped key (same convention as the
        # gosec/govulncheck caches below) rather than an auto-derived one —
        # bump the suffix if ffmpeg's resolved package set changes and the
        # cache goes stale.
        uses: actions/cache@v6
        with:
          path: ~/apt-cache/*.deb
          key: ${{ runner.os }}-apt-ffmpeg-v1

      - name: Install ffmpeg
        run: |
          # apt's internal unprivileged `_apt` download user also needs
          # access to the redirected cache dir — without this it silently
          # falls back to fetching unsandboxed as root, which observably
          # serializes the downloads and made this step ~10x slower than
          # the original /var/cache/apt/archives path.
          mkdir -p ~/apt-cache/partial
          chmod -R 777 ~/apt-cache
          sudo apt-get -o dir::cache::archives="$HOME/apt-cache" update
          sudo apt-get -o dir::cache::archives="$HOME/apt-cache" install -y ffmpeg

      - name: Start MinIO
        # Deliberately a step, not a `services:` entry: the image's
        # ENTRYPOINT is /usr/bin/docker-entrypoint.sh with CMD [minio] and
        # no "server /data", and a service container has no field to supply
        # command arguments — run bare it prints its usage banner and exits.
        # Verified directly against this exact tag. Don't "fix" this back
        # into a service container; it cannot work.
        #
        # The flags below cover what a services: block would have provided:
        # the published port the test env vars point at, and root
        # credentials matching VIDEO_MINIO_TEST_ACCESS_KEY/SECRET_KEY.
        run: |
          docker run -d --name minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data

      - name: Wait for MinIO
        # Bounded: a container that never becomes ready fails here with a
        # clear message instead of surfacing as confusing test failures.
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready within 60s" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          IDENTITY_POSTGRES_TEST_DSN: postgres://identity:identity@localhost:5432/identity?sslmode=disable
          # Same CI Postgres service and database as IDENTITY_POSTGRES_TEST_DSN —
          # video_jobs/video_job_outbox coexist with identity_users there.
          VIDEO_POSTGRES_TEST_DSN: postgres://identity:identity@localhost:5432/identity?sslmode=disable
          REDIS_TEST_ADDR: localhost:6379
          # cmd/api's composition root now requires this at startup
          # (add-upload-idempotency-keys) — same CI redis service as
          # REDIS_TEST_ADDR above.
          REDIS_ADDR: localhost:6379
          # Exercises internal/video/infrastructure/storage's own tests
          # against the MinIO container started above.
          VIDEO_MINIO_TEST_ENDPOINT: 127.0.0.1:9000
          VIDEO_MINIO_TEST_ACCESS_KEY: minioadmin
          VIDEO_MINIO_TEST_SECRET_KEY: minioadmin
          VIDEO_MINIO_TEST_BUCKET: video-test
          # cmd/api's tests read the runtime variables, not the TEST_ ones:
          # its TestMain requires MinIO the same way it requires ffmpeg.
          # Same instance as above, a different bucket — the adapter tests
          # create and delete buckets.
          VIDEO_MINIO_ENDPOINT: 127.0.0.1:9000
          VIDEO_MINIO_ACCESS_KEY: minioadmin
          VIDEO_MINIO_SECRET_KEY: minioadmin
          VIDEO_MINIO_BUCKET: video-results-test
          # Exercises internal/platform/rabbitmq's own tests against the
          # service container above. localhost:5672 is the runner's published
          # port; the broker still sees the connection arriving from the
          # bridge, which is why this is the "video" account and not guest.
          RABBITMQ_TEST_URL: amqp://video:video@localhost:5672/
          # cmd/api's TestMain requires this to be set, matching the startup
          # requirement it now has. Reachability is not required.
          RABBITMQ_URL: amqp://video:video@localhost:5672/
        run: go test ./... -v

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    env:
      GOSEC_VERSION: '2.28.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # gosec's own minimum Go requirement moves independently of this
        # project's go.mod (go 1.27) — use the latest stable toolchain to
        # install/run it, since it's a dev tool, not the app itself.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Get resolved Go version
        # 'stable' drifts as new Go releases ship (e.g. 1.26 -> 1.27), and a
        # cached gosec binary built under an older toolchain can mismatch a
        # newer one now on PATH — same staleness class the "Build & Test"
        # job's Go cache key already accounts for (see its own "Get resolved
        # Go version" step above; PR #145 fixed that job but didn't extend
        # the fix here). Folded into the cache key below so a toolchain
        # bump forces a fresh `go install` instead of reusing a stale binary.
        id: go-version
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache gosec binary
        id: cache-gosec
        uses: actions/cache@v6
        with:
          path: ~/go/bin/gosec
          key: ${{ runner.os }}-${{ runner.arch }}-gosec-v${{ env.GOSEC_VERSION }}-${{ steps.go-version.outputs.version }}

      - name: Install gosec
        # Pinned (not @latest) so the cache key above is stable across runs;
        # skipped entirely on a cache hit, since go install would otherwise
        # recompile gosec's whole dependency tree from source every run.
        if: steps.cache-gosec.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v${{ env.GOSEC_VERSION }}

      - name: Run gosec
        run: gosec ./...

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: '1.6.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # Same reasoning as the sast job: govulncheck is a dev tool, not
        # something the app ships with, so it isn't pinned to go.mod's go directive.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Get resolved Go version
        # 'stable' drifts as new Go releases ship (e.g. 1.26 -> 1.27).
        # govulncheck bundles its own source-loading logic tied to the Go
        # version it was built with, so a binary cached under an older
        # toolchain fails hard (not just silently stale like the Build &
        # Test job's compile cache — see PR #145) once the runner's "stable"
        # Go moves past it: "Loading packages failed... application uses
        # version go1.26 of the source-processing packages but runs version
        # go1.27 of 'go list'" — observed in CI on 2026-08-21 after the
        # runner's stable toolchain moved from go1.26.6 (last known-good
        # run, 2026-08-20) to go1.27.0. Folding the resolved version into
        # the cache key below forces a fresh `go install` whenever it
        # drifts, instead of reusing an incompatible binary.
        id: go-version
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache govulncheck binary
        id: cache-govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-${{ runner.arch }}-govulncheck-v${{ env.GOVULNCHECK_VERSION }}-${{ steps.go-version.outputs.version }}

      - name: Install govulncheck
        # Pinned (not @latest) so the cache key above is stable across runs;
        # skipped entirely on a cache hit.
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...
