name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the image pinned in docker-compose.yml, so "works in CI"
        # and "works locally" mean the same database.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # matches the "go" directive in go.mod, currently 1.25 (raised by the
        # gin v1.12.x upgrade, which itself requires go1.25.0).
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          IDENTITY_POSTGRES_TEST_DSN: postgres://identity:identity@localhost:5432/identity?sslmode=disable
        run: go test ./... -v

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # gosec's own minimum Go requirement moves independently of this
        # project's go.mod (go 1.25) — use the latest stable toolchain to
        # install/run it, since it's a dev tool, not the app itself.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # Same reasoning as the sast job: govulncheck is a dev tool, not
        # something the app ships with, so it isn't pinned to go.mod's go directive.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
