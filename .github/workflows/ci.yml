name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the image pinned in docker-compose.yml, so "works in CI"
        # and "works locally" mean the same database.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # matches the "go" directive in go.mod, currently 1.25 (raised by the
        # gin v1.12.x upgrade, which itself requires go1.25.0).
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          IDENTITY_POSTGRES_TEST_DSN: postgres://identity:identity@localhost:5432/identity?sslmode=disable
          # Same CI Postgres service and database as IDENTITY_POSTGRES_TEST_DSN —
          # video_jobs/video_job_outbox coexist with identity_users there.
          VIDEO_POSTGRES_TEST_DSN: postgres://identity:identity@localhost:5432/identity?sslmode=disable
        run: go test ./... -v

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    env:
      GOSEC_VERSION: '2.28.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # gosec's own minimum Go requirement moves independently of this
        # project's go.mod (go 1.25) — use the latest stable toolchain to
        # install/run it, since it's a dev tool, not the app itself.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Cache gosec binary
        id: cache-gosec
        uses: actions/cache@v6
        with:
          path: ~/go/bin/gosec
          key: ${{ runner.os }}-${{ runner.arch }}-gosec-v${{ env.GOSEC_VERSION }}

      - name: Install gosec
        # Pinned (not @latest) so the cache key above is stable across runs;
        # skipped entirely on a cache hit, since go install would otherwise
        # recompile gosec's whole dependency tree from source every run.
        if: steps.cache-gosec.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v${{ env.GOSEC_VERSION }}

      - name: Run gosec
        run: gosec ./...

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: '1.6.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # Same reasoning as the sast job: govulncheck is a dev tool, not
        # something the app ships with, so it isn't pinned to go.mod's go directive.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Cache govulncheck binary
        id: cache-govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-${{ runner.arch }}-govulncheck-v${{ env.GOVULNCHECK_VERSION }}

      - name: Install govulncheck
        # Pinned (not @latest) so the cache key above is stable across runs;
        # skipped entirely on a cache hit.
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...
