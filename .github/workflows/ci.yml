name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # matches the "go" directive in go.mod, currently 1.25 (raised by the
        # gin v1.12.x upgrade, which itself requires go1.25.0).
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        # gosec's own minimum Go requirement moves independently of this
        # project's go.mod (go 1.21) — use the latest stable toolchain to
        # install/run it, since it's a dev tool, not the app itself.
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
