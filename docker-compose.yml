# Local development/test infrastructure. Scoped to what the Identity and
# Video contexts need today (PostgreSQL, Redis, MinIO, RabbitMQ); later
# roadmap phases extend this file rather than replacing it.
#
# The credentials below are fixed, non-secret local-only defaults — this
# service is never reachable from anywhere but the developer's own machine
# or CI, so there is nothing here worth protecting.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the five databases the "identity" runtime database above
      # does not cover, on first init: a runtime database per bounded
      # context and a test counterpart for each — see the SQL file's own
      # comment for why the contexts do not share one.
      #
      # Init scripts run only on an empty data directory, so a volume that
      # predates this arrangement holds identity and identity_test alone
      # and needs the other four created against the running container:
      #
      #   for db in video video_test notification notification_test; do
      #     docker compose exec -T postgres \
      #       psql -U identity -d identity -c "CREATE DATABASE $db"
      #   done
      #
      # Not "docker compose down -v" — that removes minio_data and
      # rabbitmq_data with it, which the volume comments below warn about.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  # No named volume: this instance backs idempotency keys, rate-limit
  # counters, and a status cache — all explicitly non-authoritative (see
  # ddd-architecture spec's "PostgreSQL is authoritative on cache miss").
  # Losing its contents on restart is a correctness non-event by design.
  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only: this instance is unauthenticated, same rationale as
      # the "video-api" service's port binding through the gateway below.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Named volume, unlike the redis service directly above: once
  # migrate-result-storage-to-minio lands, this bucket holds the only durable
  # copy of every completed job's zip, so wiping it on `docker compose down`
  # would leave completed video_jobs rows pointing at objects that no longer
  # exist — the same dangling state postgres_data exists to prevent.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      # Fixed, non-secret local-only defaults — same rationale as the
      # Postgres credentials above. These are the MinIO server's own
      # variables, not internal/video/infrastructure/storage's VIDEO_MINIO_*
      # configuration.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Loopback-only: same rationale as the redis service above.
      # 9000 is the S3 API, 9001 the web console.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Named volume and a pinned hostname, unlike the redis service above.
  # Redis holds explicitly non-authoritative data, so losing it on restart is
  # a correctness non-event; a queued job is not. Once the outbox relay has a
  # broker acknowledgement and stamps published_at, the message is the only
  # remaining record that the job is waiting to be processed — wiping it
  # loses real work with nothing left in PostgreSQL to replay, the same
  # dangling state minio_data exists to prevent.
  #
  # The hostname is what makes the volume work, not decoration: RabbitMQ
  # stores its Mnesia database under mnesia/rabbit@<hostname>, and Compose
  # gives a recreated container a freshly generated hostname — so a persisted
  # volume would be reopened by a node with a different name, starting empty
  # beside the old directory rather than resuming it.
  #
  # Consequence worth knowing: a plain `docker compose down` no longer
  # clears queued messages. Do NOT reach for `down -v` to clear them — that
  # removes every named volume in this project, destroying postgres_data and
  # minio_data too. Reset this service alone: stop it, `rm -f` it, then
  # `docker volume rm <project>_rabbitmq_data`. See docs/operations.md.
  rabbitmq:
    image: rabbitmq:4-alpine
    hostname: rabbitmq
    environment:
      # A dedicated account rather than the built-in "guest", which RabbitMQ
      # confines to loopback as the broker itself sees it — every connection
      # here arrives over this compose network from another address, so a
      # guest URI fails with ACCESS_REFUSED. Do not simplify this back to
      # guest. Fixed, non-secret, local-only, same posture as the Postgres
      # and MinIO credentials above.
      RABBITMQ_DEFAULT_USER: video
      RABBITMQ_DEFAULT_PASS: video
    ports:
      # Loopback-only: same rationale as the redis and minio services above.
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  # The single ingress. Everything a client reaches, it reaches here: the
  # gateway is the only service that publishes a host port, and the
  # application services publish none. One rule per HTTP service: /api/auth/
  # to identity-api, /api/notification-preferences to notification-api, and
  # everything else to video-api, which serves the frontend at the root.
  gateway:
    image: nginx:1.29-alpine
    ports:
      # Loopback-only: an unqualified "8080:8080" binds to all host
      # interfaces, exposing a stack whose Postgres and MinIO credentials
      # are fixed and repository-visible to any peer on the network. There's
      # no legitimate reason this local dev service needs LAN reachability.
      - "127.0.0.1:8080:8080"
    volumes:
      # Replaces the image's own nginx.conf, read-only.
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-api
      - video-api
      - notification-api
    healthcheck:
      # Asks nginx whether its own configuration is loadable. Deliberately not
      # a request through to a backend: the gateway is healthy when it can serve,
      # and tying its health to a backend's would make an unrelated service's
      # restart look like an ingress failure.
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Identity context's own HTTP process: the only one that holds a
  # private key and the only one that can mint a token. Its configuration
  # surface is the whole point — four variables, all Identity's own. No
  # Redis, no MinIO, no broker, no ffmpeg, and no port: the gateway routes
  # /api/auth/ here.
  identity-api:
    build: .
    command: ["/app/identity-api"]
    environment:
      IDENTITY_POSTGRES_DSN: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      # See the "video-api" service below for why this key pair is generated rather
      # than committed. This is the one service whose environment carries the
      # private half.
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:?run "make dev-keys" to generate a local key pair}
      IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:?run "make dev-keys" to generate a local key pair}
      # Required despite this service registering no authenticated route: it
      # checks at startup that the public half it is given matches the private
      # one it signs with. A mismatched pair fails nowhere it can be
      # attributed otherwise.
      IDENTITY_JWT_PUBLIC_KEYS: ${IDENTITY_JWT_PUBLIC_KEYS:?run "make dev-keys" to generate a local key pair}
    depends_on:
      postgres:
        condition: service_healthy
    # Longer than main.go's 30s shutdownTimeout. Compose sends SIGKILL 10s
    # after SIGTERM by default, so without this the graceful window the
    # process asks for cannot be honoured and an in-flight registration is
    # killed mid-transaction.
    stop_grace_period: 45s

  # The Notification context's own HTTP process: the preference routes, and
  # nothing else. It holds a verifier and no private key — there is no code
  # path in this binary that can construct an issuer — and no video database,
  # no bucket and no broker.
  #
  # REDIS_ADDR is here because the routes are rate limited, not because this
  # service caches anything: the limiter's counter is shared with every other
  # HTTP service, so the budget stays one budget per user across the system.
  notification-api:
    build: .
    command: ["/app/notification-api"]
    environment:
      NOTIFICATION_POSTGRES_DSN: postgres://identity:identity@postgres:5432/notification?sslmode=disable
      # Verification material only. The private half lives on identity-api
      # and nowhere else.
      IDENTITY_JWT_PUBLIC_KEYS: ${IDENTITY_JWT_PUBLIC_KEYS:?run "make dev-keys" to generate a local key pair}
      # The limiter's backing store, shared with every other service that
      # mounts the middleware. RATE_LIMIT_MAX_REQUESTS and
      # RATE_LIMIT_WINDOW_SECONDS are left unset here and everywhere else, so
      # every service holds one threshold and one window from one source —
      # the code default. Setting them on one service alone would compare a
      # shared count against two thresholds.
      REDIS_ADDR: redis:6379
      # The same relaxation the "notifier" service below sets, and set here
      # for the same local-stack reason: this half of the destination policy
      # judges a destination when it is registered, so without it PUT
      # /api/notification-preferences would refuse the only kind of receiver
      # this stack can host — an "http" container hostname on a private
      # network. One policy, two readers: a deployment whose two processes
      # disagree either stores destinations it can never deliver to or
      # refuses at dial what it accepted at write time. Never set in
      # production; see the notifier for what it costs there.
      NOTIFICATION_ALLOW_INSECURE_DESTINATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same reason as identity-api above: Compose's 10s default would SIGKILL
    # this process well inside the 30s graceful window it asks for.
    stop_grace_period: 45s

  # The Video Processing context's own HTTP process: POST /upload, the
  # download and status routes, the job-lifecycle API, the embedded frontend,
  # and the dispatch outbox relay. It is the gateway's default route, so it
  # holds every path the two services above do not name.
  #
  # It runs the same Dockerfile used for deployment, built to its default
  # "runtime" target (hardened, non-root, no Go toolchain — see the
  # Dockerfile's own comments). Running the test suite uses the separate
  # "app-test" service below, since this image has no Go toolchain to run
  # `go test` with.
  video-api:
    build: .
    command: ["/app/video-api"]
    # No ports. The gateway is the only service that publishes one.
    environment:
      # Fixed, non-secret local-only defaults — same rationale as the
      # Postgres credentials above. Never used outside a developer's
      # machine or CI.
      # No IDENTITY_POSTGRES_DSN and no private key. This process verifies
      # tokens and administers no account, so the identity database and the
      # ability to mint are both absent rather than merely unused — a
      # dependency a process does not use should not be reachable from it.
      #
      # The local RSA key pair is NOT repository material, deliberately unlike
      # the Postgres credentials above: a committed private key is one copy
      # away from a deployment, and no reader can tell a development key from
      # a promoted one by looking at it. `make dev-keys` writes a per-machine
      # pair into a git-ignored .env, which Compose loads from the project
      # directory; the :? default turns a missing one into that instruction
      # instead of a container that starts and rejects every token.
      # IDENTITY_JWT_PUBLIC_KEYS is a JSON object mapping key id to PEM public
      # key — a set, so a rotation can hold the outgoing and incoming keys at
      # once — and is read by every service that verifies.
      IDENTITY_JWT_PUBLIC_KEYS: ${IDENTITY_JWT_PUBLIC_KEYS:?run "make dev-keys" to generate a local key pair}
      # video_jobs/video_job_outbox live in the Video context's own
      # "video" database — same PostgreSQL server as identity_users, a
      # different database. Deliberately not the IDENTITY_* value: a
      # query joining the two contexts' tables has to fail as an unknown
      # relation rather than return rows (ddd-architecture's "Context
      # Storage Isolation Is Exhibited, Not Only Permitted").
      VIDEO_POSTGRES_DSN: postgres://identity:identity@postgres:5432/video?sslmode=disable
      VIDEO_POSTGRES_TEST_DSN: postgres://identity:identity@postgres:5432/video_test?sslmode=disable
      # Required as of add-upload-idempotency-keys: this service's
      # composition root opens a Redis client for POST /upload's idempotency
      # mechanism, and the rate limiter shares it.
      REDIS_ADDR: redis:6379
      # Required as of migrate-result-storage-to-minio: this service opens a
      # MinIO client at startup, pings it, and ensures the bucket, failing
      # fatally if any step fails. Fail-closed, unlike the Redis-backed
      # features above — a result that cannot be stored cannot be delivered,
      # so there is nothing to degrade to. VIDEO_MINIO_USE_SSL stays
      # optional and is omitted: this loopback service speaks plain HTTP.
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY: minioadmin
      VIDEO_MINIO_SECRET_KEY: minioadmin
      VIDEO_MINIO_BUCKET: video-results
      # Deliberately not minio:9000. GET /download/:filename hands the
      # browser a presigned URL, and SigV4 signs Host, so the host has to be
      # right at signing time — it cannot be rewritten afterwards. minio:9000
      # only resolves inside this compose network; 127.0.0.1:9000 is the
      # published port the developer's browser actually reaches. The server
      # never dials this address.
      VIDEO_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      # Required as of add-videojob-source-key-and-outbox-relay: this service
      # loads this at startup and exits without it. Deliberately absent from
      # depends_on below — a service_healthy condition would make broker
      # reachability a startup gate, which is exactly the coupling the relay
      # exists to avoid. The API serves normally with the broker down; the
      # relay retries in the background.
      RABBITMQ_URL: amqp://video:video@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Same reason as identity-api above, and it matters more here: shutdown
    # joins the outbox relay, which holds a database transaction while it
    # runs. The 10s default would SIGKILL it mid-claim.
    stop_grace_period: 45s

  # The other half of the cutover: same image as "video-api", different
  # binary.
  # POST /upload now only queues a job, so without this service running,
  # nothing ever moves one out of "queued".
  #
  # No IDENTITY_* variables and no published port, and both absences are the
  # point. The worker acts on a job named by an internal dispatch, never on
  # behalf of a caller, so it needs no signing key and no way in from
  # outside; the only thing that can give it work is the broker.
  #
  # depends_on includes rabbitmq, unlike "video-api". The API serves fine with the
  # broker down — its relay retries in the background — but a worker with no
  # broker has nothing at all to do, so there is no availability to protect
  # by starting it early. It still dials with retry: this only orders
  # startup.
  worker:
    build: .
    command: ["/app/worker"]
    # Three of them, so the stack this repository documents as its single
    # command demonstrates concurrent processing rather than requiring a flag
    # to reveal it. Worker count *is* the concurrency knob and there is no
    # other: prefetch is 1, so a worker holds exactly one job at a time by
    # design, and three workers means three extractions at once. Nothing else
    # here changes to accommodate them — the three share this one definition.
    #
    # Three workers cannot both run one job because job pickup is an atomic
    # conditional UPDATE (... WHERE id = $1 AND status = 'queued'), not
    # because of the Redis lease, which is liveness for crash recovery and
    # never mutual exclusion. Their outbox relays step over each other with
    # SKIP LOCKED, and their recovery sweepers are safe by the same
    # conditional-write argument.
    #
    # "deploy" here is not a Swarm deployment descriptor. `replicas` is
    # honoured by a plain `docker compose up` outside Swarm (verified), and
    # that is the whole of what this file relies on the section for — so do
    # not "clean it up" as dead Swarm config, because the default concurrency
    # depends on it. `--scale worker=N` still overrides it in both directions,
    # so `--scale worker=1` remains the one-flag way back to a single worker.
    #
    # Only this service is replicated. The three HTTP services deliberately
    # stay at one each: nothing about this stack needs a second replica of
    # any of them, and the gateway resolves one name per service. "notifier"
    # stays at one because video-processing throughput is what this is for,
    # and delivery is not its bottleneck.
    deploy:
      replicas: 3
    environment:
      # Identical to the "video-api" service's Video Processing configuration —
      # same database, same bucket, same broker. The two processes are two
      # halves of one context.
      VIDEO_POSTGRES_DSN: postgres://identity:identity@postgres:5432/video?sslmode=disable
      REDIS_ADDR: redis:6379
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY: minioadmin
      VIDEO_MINIO_SECRET_KEY: minioadmin
      VIDEO_MINIO_BUCKET: video-results
      # Deliberately absent: VIDEO_MINIO_PUBLIC_ENDPOINT. The worker never
      # presigns — issuing download grants is the API's job — so it has no
      # reason to know the browser-facing address, and it defaults to the
      # internal one it can actually reach.
      RABBITMQ_URL: amqp://video:video@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # The third process on the same image: it consumes the terminal-event
  # queue the worker publishes to and delivers each outcome to the webhook
  # destinations its owner registered.
  #
  # Its environment is the narrowest of the three, and the absences are the
  # point. No IDENTITY_*, because it authenticates no caller; no
  # VIDEO_MINIO_*, because it stores and reads no artifact; no REDIS_ADDR,
  # because it holds no lease and caches nothing. depends_on names postgres
  # and rabbitmq alone for the same reason, and includes rabbitmq — unlike
  # "video-api" — because a notifier with no broker has nothing at all to do, so
  # there is no availability to protect by starting it early. It still dials
  # with retry: this only orders startup.
  notifier:
    build: .
    command: ["/app/notifier"]
    environment:
      # The same instance and database the "notification-api" service points
      # at — one
      # PostgreSQL server shared by the bounded contexts, not a connection.
      # The notifier migrates its own schema at startup, so it can be started
      # against a database no API has yet touched.
      NOTIFICATION_POSTGRES_DSN: postgres://identity:identity@postgres:5432/notification?sslmode=disable
      RABBITMQ_URL: amqp://video:video@rabbitmq:5672/
      # Set here and NEVER in production. It relaxes the destination policy's
      # scheme rule and its address rule together: with it, a preference may
      # name an "http" URL and may resolve to a private address. That is
      # exactly what a local stack needs — there is no TLS here and a webhook
      # receiver is a container hostname on this private network — and it is
      # exactly what turns the delivery client into an SSRF primitive
      # anywhere else, able to reach 169.254.169.254 and every internal
      # service reachable from this process. Unset, the default posture is
      # https-only to globally-reachable unicast.
      NOTIFICATION_ALLOW_INSECURE_DESTINATIONS: "true"
      # The mail service below, which captures everything and delivers
      # nothing onward. No credentials, deliberately: the client refuses to
      # authenticate over a session with no encryption, so configuring a
      # username here would make the local stack fail every delivery. That
      # rule is not the destination policy's and the relaxation above does
      # not reach it — the relay is operator-supplied, and what it protects
      # is this deployment's own credential.
      NOTIFICATION_SMTP_ADDR: mail:1025
      NOTIFICATION_SMTP_FROM: notifier@fiapx.local
    # Longer than this process's shutdown drain, which is one MaxClaimHold()
    # per delivery channel plus a 30s grace — 90s at the documented budget
    # with two channels. Compose's default is 10 seconds, so without this
    # `docker compose stop`/`down` would SIGKILL a delivery still in flight
    # and leave a claim unresolved: the exact state the join-before-close
    # ordering exists to avoid, produced routinely by the documented local
    # workflow.
    #
    # The coupling is to the budget and the channel count, not to the number:
    # raising NOTIFICATION_WEBHOOK_MAX_ATTEMPTS or
    # NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS on this service lengthens the
    # drain, and so does adding a channel. This value has to stay above
    # channels x MaxClaimHold() + 30s for whatever is configured here.
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mail:
        condition: service_started

  # A local mail catcher: it accepts every message and delivers none onward,
  # so a contributor can register an e-mail preference and read the result
  # without configuring an external relay and without any risk of sending to
  # a real address.
  #
  # Like the gateway, it is built from an image this repository does not
  # produce and carries no binary, key or credential of ours.
  mail:
    image: axllent/mailpit:v1.21
    # SMTP is reachable only on this private network; the inspection UI gets
    # a host port of its own rather than a route on the gateway. The gateway
    # serves the application's own surface, and a path there for a
    # development-only UI would exist in no deployment. Loopback-only for the
    # same reason the gateway is.
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Built from the Dockerfile's "test" stage (Go toolchain + ffmpeg) rather
  # than the runtime services' hardened "runtime" stage, which deliberately
  # has neither.
  # `docker compose run --build --rm app-test go test ./... -v` is how the
  # suite runs via Docker going forward (docs/development.md is updated in
  # a follow-up docs PR, per this repo's PR-separation rule).
  #
  # Behind the "test" profile so `docker compose up`/`up --build` (no
  # --profile flag) never starts this service — its "test" image build
  # target has no long-running command and would just exit immediately.
  # `docker compose run`/`run --build` explicitly targets a service and
  # starts it (and its dependencies) regardless of profile gating, so the
  # command above still works unchanged.
  app-test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      IDENTITY_POSTGRES_DSN: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      IDENTITY_POSTGRES_TEST_DSN: postgres://identity:identity@postgres:5432/identity_test?sslmode=disable
      # See the "video-api" service above for why these name the Video context's
      # own databases rather than the IDENTITY_* ones.
      VIDEO_POSTGRES_DSN: postgres://identity:identity@postgres:5432/video?sslmode=disable
      VIDEO_POSTGRES_TEST_DSN: postgres://identity:identity@postgres:5432/video_test?sslmode=disable
      # Mirrors the "notification-api" service above, which requires it at
      # startup. Same server as the two above, its own database — the bounded
      # contexts share a PostgreSQL server, not a database and not a
      # connection.
      NOTIFICATION_POSTGRES_DSN: postgres://identity:identity@postgres:5432/notification?sslmode=disable
      # Exercises internal/notification/infrastructure/postgres's own test
      # suite against a real instance; without it that suite skips and the
      # adapter's create-with-no-secret refusal — enforced by a row count
      # rather than by any Go branch — goes uncovered.
      NOTIFICATION_POSTGRES_TEST_DSN: postgres://identity:identity@postgres:5432/notification_test?sslmode=disable
      # Exercises internal/platform/redis's own test suite against a real
      # instance.
      REDIS_TEST_ADDR: redis:6379
      # See the "video-api" service above — its composition root requires this
      # at startup, and this value matches it.
      REDIS_ADDR: redis:6379
      # Exercises internal/video/infrastructure/storage's own test suite
      # against a real instance. The test bucket is separate from the runtime
      # bucket below for the same reason identity_test is separate from
      # identity — these tests create and delete buckets.
      VIDEO_MINIO_TEST_ENDPOINT: minio:9000
      VIDEO_MINIO_TEST_ACCESS_KEY: minioadmin
      VIDEO_MINIO_TEST_SECRET_KEY: minioadmin
      VIDEO_MINIO_TEST_BUCKET: video-test
      # See the "video-api" service above. cmd/video-api's own tests read
      # these: its TestMain requires MinIO the same way it requires ffmpeg, since
      # POST /upload stores its result in a bucket and GET /download and
      # GET /api/status read it back from one.
      VIDEO_MINIO_ENDPOINT: minio:9000
      VIDEO_MINIO_ACCESS_KEY: minioadmin
      VIDEO_MINIO_SECRET_KEY: minioadmin
      VIDEO_MINIO_BUCKET: video-results-test
      # Exercises internal/platform/rabbitmq's and
      # internal/video/infrastructure/messaging's own test suites against a
      # real broker.
      RABBITMQ_TEST_URL: amqp://video:video@rabbitmq:5672/
      # See the "video-api" service above. cmd/video-api's TestMain requires
      # this to be set, matching the startup requirement — not to be
      # reachable, which cmd/video-api itself does not require either.
      RABBITMQ_URL: amqp://video:video@rabbitmq:5672/
      # Mirrors "notification-api" rather than being needed by any test:
      # cmd/notification-api's tests build their module by hand and pass the
      # posture they mean to exercise, so both postures are covered whatever
      # this says. It is here because a difference left in it would be read
      # later as a deliberate one.
      NOTIFICATION_ALLOW_INSECURE_DESTINATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
