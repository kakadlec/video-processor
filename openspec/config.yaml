schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  FIAP X - Processador de Vídeos: a POSTECH/FIAP hackathon deliverable.
  Tech stack: Go 1.25, Gin web framework, ffmpeg (shelled out via os/exec).
  Single-package app (main.go) with no internal module structure yet.
  User-facing strings (errors, HTML UI) are in Portuguese (pt-BR) - keep new
  ones consistent with that.
  State model: uploads/ (transient input), temp/ (per-request ffmpeg scratch
  dir, always cleaned up), outputs/ (durable zip results) - no database.
  Processing is synchronous and in-request (no job queue yet).
  main_test.go covers integration tests (requires ffmpeg; exits 1 with an
  error if absent — use Docker fallback). CI (.github/workflows/ci.yml) runs
  Build & Test (go vet + go test), SAST (gosec), and Vulnerability Scan
  (govulncheck). Workflow choices, including OpenSpec and pull requests,
  are optional and explicitly selected by the user.

