# Gateway for the local development stack: the one process that publishes a
# host port, in front of the application services. This file replaces the
# stock image's /etc/nginx/nginx.conf outright, so everything the image set
# and this stack still needs has to be restated here — anything omitted falls
# back to nginx's compiled-in default, not to the image's.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        # Docker's embedded DNS, consulted per request rather than once at
        # configuration load. See the comment above the location blocks:
        # this resolver is only reachable because the address is a variable.
        # ipv6=off because the embedded resolver answers AAAA for names that
        # have no IPv6 address, and nginx would try that answer first.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # nginx defaults to 1 MB and answers anything larger with its own 413,
        # before the upstream sees the request — so the extension check and the
        # streaming hash in POST /upload would never run. 0 disables the limit;
        # what bounds an upload is the application, not the hop in front of it.
        client_max_body_size 0;

        # Without this nginx spools the whole request body to its own disk
        # before opening the upstream connection, which reintroduces exactly
        # the local-disk write POST /upload exists not to make — one layer up,
        # where nothing in this repository would clean it up.
        proxy_request_buffering off;

        # Load-bearing with the line above, not hygiene. HTTP/1.0 upstreams
        # have no chunked encoding, so nginx cannot forward a body of unknown
        # length unbuffered and falls back to buffering it. Browser multipart
        # carries a Content-Length and would stream either way, which is what
        # makes the omission easy to miss.
        proxy_http_version 1.1;

        # Response buffering is left at its default. GET /download/:filename
        # returns a small JSON document naming a presigned URL, and the bytes
        # it authorizes are fetched from MinIO directly, so no large response
        # passes through here.

        # Above the longest legitimate request. POST /upload answers 202 as
        # soon as the job is queued, so the bound is upload transfer time and
        # not ffmpeg time — extraction happens in a worker, off the request.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Nothing reads these today. They are set because omitting them makes
        # the first thing that does silently wrong rather than absent.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every upstream address below is held in a variable deliberately. A
        # hostname written literally in proxy_pass is resolved once, when
        # nginx loads its configuration, and cached for the worker's life:
        # recreating a backend gives it a new address and the gateway keeps
        # sending traffic to the old one until it is reloaded. That fails in
        # the shape of the backend being down, not of the gateway being
        # stale. A variable defers resolution to request time, through the
        # resolver declared above. `set` is per-location, so each block
        # declares its own.

        # The Identity context's own service. An exact prefix rather than the
        # default route, because everything else belongs to the Video API.
        location /api/auth/ {
            set $backend "identity-api:8080";
            proxy_pass http://$backend;
        }

        # The Notification context's own service. A prefix without a trailing
        # slash, deliberately unlike the rule above: /api/auth/ has routes
        # beneath it, while this path is the resource itself and has none. A
        # trailing-slash location would match nothing a client sends, and the
        # requests would fall through to "video-api", which does not serve
        # them. The prefix form also carries /api/notification-preferences/ to
        # the service that answers it, which is where gin's own trailing-slash
        # redirect is issued.
        location /api/notification-preferences {
            set $backend "notification-api:8080";
            proxy_pass http://$backend;
        }

        # The Video Processing context's own service, and the default route:
        # it holds every path the two rules above do not name, including the
        # embedded frontend at /, /styles.css and /app.js. It is the default
        # rather than a prefix because it serves the root itself — a prefix
        # rule for it would have to be "/" anyway.
        location / {
            set $backend "video-api:8080";
            proxy_pass http://$backend;
        }
    }
}
